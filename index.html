<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glosarium Iklim</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header & Pencarian -->
  <header class="bg-teal-800 text-white py-10 px-4 shadow-md">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">
        Glosarium Perubahan Iklim
      </h1>
      <p class="text-teal-100 text-sm md:text-base max-w-2xl mx-auto">
        Kamus digital istilah ilmiah klimatologi, meteorologi, dan dinamika atmosfer
      </p>
      
      <!-- Kolom Pencarian -->
      <div class="mt-6 max-w-xl mx-auto">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari istilah, terjemahan, atau penjelasan..." 
          class="w-full px-5 py-3 rounded-full text-slate-800 shadow-md focus:outline-none focus:ring-4 focus:ring-teal-400 text-sm md:text-base"
        >
      </div>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Filter Alfabet (A-Z) -->
    <div id="alphabetFilter" class="flex flex-wrap justify-center gap-1.5 mb-8"></div>

    <!-- Info Status Data -->
    <div class="flex justify-between items-center mb-6 pb-2 border-b border-slate-200 text-sm">
      <span id="resultCount" class="font-medium text-slate-600">Memuat data glosarium...</span>
      <button 
        id="resetFilter" 
        class="text-teal-700 hover:text-teal-900 font-semibold text-xs uppercase tracking-wider hidden"
      >
        Reset Filter
      </button>
    </div>

    <!-- Grid Kartu Glosarium -->
    <div id="glossaryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
    <p>&copy; 2026 Glosarium Klimatologi & Perubahan Iklim. Dikelola secara digital.</p>
  </footer>

  <!-- Pop-up Modal Detail -->
  <div 
    id="detailModal" 
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50"
  >
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 md:p-8 shadow-2xl relative border border-slate-100">
      
      <!-- Tombol Tutup -->
      <button 
        id="closeModal" 
        type="button"
        class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-2xl font-bold w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition"
      >
        &times;
      </button>

      <!-- Content Modal -->
      <span 
        id="modalCategory" 
        class="inline-block text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 border border-teal-200 px-3 py-1 rounded-full mb-3"
      ></span>

      <h2 id="modalTerm" class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-1 leading-tight"></h2>
      
      <p id="modalTranslation" class="text-base italic text-teal-600 font-medium mb-4"></p>

      <div class="border-t border-slate-100 pt-4">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Definisi Lengkap</h3>
        <p id="modalDefinition" class="text-slate-700 leading-relaxed text-sm md:text-base max-h-60 overflow-y-auto pr-2"></p>
      </div>

    </div>
  </div>

  <!-- Memanggil JavaScript -->
  <script src="app.js"></script>
</body>
</html>
